name: Lab09 LaTeX - Compile Document

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sspa
  IMAGE_TAG: latest-latex

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile PDF
        run: |
          latexmk -pdf -interaction=nonstopmode codes/lab09/latex/main.tex
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab09-latex-pdf
          path: codes/lab09/latex/main.pdf

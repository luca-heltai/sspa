name: Lab09 LaTeX - Registry Compile

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sspa
  IMAGE_TAG: latest-latex

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile PDF in registry image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/codes/lab09/latex:/work \
            -w /work \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            latexmk -pdf -interaction=nonstopmode main.tex
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab09-latex-pdf
          path: codes/lab09/latex/main.pdf
